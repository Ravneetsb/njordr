services:
  website:
    build: .
    restart: unless-stopped
    environment:
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    ports:
      - "${HOST_PORT:-8080}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
